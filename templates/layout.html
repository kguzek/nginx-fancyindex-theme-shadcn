<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{{site_title}}</title>
    <link rel="stylesheet" href="/.fancyindex/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">{{site_subheading}}</p>
          <h1 {{site_heading_attributes}}>{{site_heading}}</h1>
        </div>
      </header>

      <nav
        class="breadcrumbs"
        data-breadcrumbs
        aria-label="Breadcrumb"
        aria-live="polite"
      >
        <span>Home</span>
      </nav>

      <main class="{{main_class}}" aria-label="{{main_aria_label}}">
        <!-- content-goes-here -->
      </main>

      <footer class="site-footer">
        <span>
          <a
            class="site-footer__muted-link"
            href="https://github.com/kguzek/nginx-fancyindex-theme-shadcn"
            rel="noopener noreferrer"
          >
            nginx-fancyindex-theme-shadcn
          </a>
          <span class="site-footer__dot" aria-hidden="true"></span>
          <span>
            Copyright &copy; 2025-<span class="year-slot" data-current-year>
              2026
            </span>
            by
            <a href="https://www.guzek.uk" rel="noopener noreferrer">
              Konrad Guzek
            </a>
          </span>
        </span>
        <span class="site-footer__dot" aria-hidden="true"></span>
        <span class="time-slot" data-generated-time>0000-00-00 00:00</span>
      </footer>
    </div>

    <script src="/.fancyindex/script.js"></script>
  </body>
</html>
